ius:10px;background:white;padding:10px 12px;color:#1a2b48;outline:none}.field textarea{min-height:100px;resize:vertical}.field input:focus,.field textarea:focus,.field select:focus{border-color:#5284de;box-shadow:0 0 0 3px #5284de22}.client{display:flex;gap:12px;align-items:center;border-bottom:1px solid #edf0f6;padding:12px 0;cursor:pointer}.client:last-child{border:0}.initial{display:grid;place-items:center;flex-shrink:0;width:45px;height:45px;border-radius:13px;background:#e5f1ff;color:#2d66ac;font-weight:800}.modalshade{position:fixed;inset:0;background:#0d1e3c8c;display:flex;align-items:end;justify-content:center;z-index:20;padding:0}@media(min-width:700px){.modalshade{align-items:center;padding:20px}}.modal{background:#f8faff;border-radius:22px 22px 0 0;width:min(100%,610px);padding:20px 20px calc(25px + env(safe-area-inset-bottom));max-height:92dvh;overflow:auto}@media(min-width:700px){.modal{border-radius:22px}}.modalhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}.close{border:none;background:#e9edf5;border-radius:10px;width:32px;height:32px;font-size:20px}.empty{color:#78869c;text-align:center;padding:32px 15px}.alert{background:#fef7e9;border:1px solid #fbe6ba;border-radius:13px;padding:12px 14px;color:#805b1c;font-size:13px}.task{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #edf0f6}.task input{width:20px;height:20px;accent-color:#2366d5}.tabline{display:flex;gap:6px;margin-bottom:14px}.tabline button{border:0;border-radius:10px;padding:9px 14px;background:#e9edf5;color:#4b5f7d;font-weight:750}.tabline button.active{background:#dce9ff;color:#1c5cc8}.notice{background:#edf5ff;border-radius:12px;padding:12px;color:#38598d;font-size:13px}.divider{height:1px;background:#e8edf5;margin:15px 0}.filter{padding:10px 14px;border:1px solid #dce4ef;border-radius:10px;background:#fff;max-width:100%}.iconbtn{background:none;border:0;color:#315fb5;font-weight:700;padding:7px}.right{margin-left:auto const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),dateISO=d=>{let x=new Date(d);return [x.getFullYear(),String(x.getMonth()+1).padStart(2,'0'),String(x.getDate()).padStart(2,'0')].join('-')},today=dateISO(new Date()),tomorrow=dateISO(new Date(Date.now()+864e5)),datefmt=s=>new Date(s+'T12:00:00').toLocaleDateString('en-AU',{weekday:'long',day:'numeric',month:'long'}),timefmt=s=>{if(!s)return '—';let [h,m]=s.split(':').map(Number);return new Date(2020,1,1,h,m).toLocaleTimeString('en-AU',{hour:'numeric',minute:'2-digit'})},duration=(a,b)=>{let [h,m]=a.split(':').map(Number),[x,y]=b.split(':').map(Number);return Math.max(0,(x*60+y-h*60-m)/60)},id=()=>Math.random().toString(36).slice(2,10),stamp=()=>new Date().toISOString();
const demo=()=>({name:'Care Worker',clients:[{id:'c1',name:'Alex Morgan',phone:'',address:'',support:'Community access and independent living',goals:'Build confidence with shopping and community participation.',alerts:'Demo client — replace with your own details.'},{id:'c2',name:'Jordan Taylor',phone:'',address:'',support:'Daily living assistance',goals:'Maintain independence in daily routines.',alerts:'Demo client — replace with your own details.'}],shifts:[{id:'s1',clientId:'c1',date:today,start:'09:00',end:'12:00',service:'Community access',location:'',status:'scheduled',tasks:[{name:'Review support goals',done:false},{name:'Assist with planned activities',done:false}],clockIn:null,clockOut:null},{id:'s2',clientId:'c2',date:tomorrow,start:'10:00',end:'14:00',service:'Daily living support',location:'',status:'scheduled',tasks:[{name:'Review care plan',done:false}],clockIn:null,clockOut:null}],notes:[]});
let db;try{db=JSON.parse(localStorage.getItem('careflow-v1'))||demo()}catch{db=demo()}let page='home',selected=today,modal='',detailTab='overview';const save=()=>{try{localStorage.setItem('careflow-v1',JSON.stringify(db))}catch{alert('Storage is unavailable. Export a backup to save your data.')}},client=c=>db.clients.find(x=>x.id===c)||{name:'Deleted client'},short=s=>s.split(' ').map(x=>x[0]).slice(0,2).join('').toUpperCase();
const icons={home:'<path d="m3 10 9-7 9 7v10H3z"/><path d="M9 20v-7h6v7"/>',roster:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4M17 3v4M3 10h18"/>',clients:'<circle cx="9" cy="8" r="3"/><path d="M3 20v-2a6 6 0 0 1 12 0v2M17 11a3 3 0 1 0-1-6M18 15a5 5 0 0 1 3 5"/>',notes:'<path d="M5 3h11l4 4v14H5zM16 3v5h4M9 13h7M9 17h7"/>',more:'<circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/>'};const icon=n=>`<svg viewBox="0 0 24 24">${icons[n]}</svg>`;
function navrender(){ $('#nav').innerHTML=[['home','Today'],['roster','Roster'],['clients','Clients'],['notes','Notes'],['more','More']].map(([n,t])=>`<button class="${page===n?'active':''}" onclick="go('${n}')">${icon(n)}${t}</button>`).join('')};function go(p){page=p;modal='';$('#modalHost').innerHTML='';render();window.scrollTo(0,0)}function header(title,kicker,action=''){return `<div class="heading"><div><div class="eyebrow">${kicker}</div><h1>${title}</h1></div>${action}</div>`}const status=s=>`<span class="pill ${s==='completed'?'green':s==='in progress'?'orange':'grey'}">${esc(s)}</span>`;
function shiftcard(s){let c=client(s.clientId);return `<div class="shift"><div class="time">${timefmt(s.start)}<div style="padding-top:5px;color:#8498b9">${timefmt(s.end)}</div></div><div class="shiftbody"><div class="row"><h3>${esc(c.name)}</h3>${status(s.status)}</div><div class="muted">${esc(s.service)} · ${duration(s.start,s.end)} hrs</div><div class="muted">${esc(datefmt(s.date))}${s.location?' · '+esc(s.location):''}</div><button class="btn secondary small" onclick="openShift('${s.id}')">View shift →</button></div></div>`}
function dashboard(){let shifts=db.shifts.filter(s=>s.date===today).sort((a,b)=>a.start.localeCompare(b.start)),upcoming=db.shifts.filter(s=>s.date>=today&&s.status!=='completed').sort((a,b)=>(a.date+a.start).localeCompare(b.date+b.start));return header('Good '+(new Date().getHours()<12?'morning':new Date().getHours()<17?'afternoon':'evening')+', '+esc(db.name.split(' ')[0]),datefmt(today),`<button class="btn small" onclick="newShift()">+ Shift</button>`)+`<div class="grid"><div class="card stat"><span class="label">Today's shifts</span><b>${shifts.length}</b></div><div class="card stat"><span class="label">Scheduled hours</span><b>${shifts.reduce((v,s)=>v+duration(s.start,s.end),0).toFixed(1)}</b></div><div class="card stat"><span class="label">Clients</span><b>${db.clients.length}</b></div></div><div class="card"><div class="row"><h2>Today's roster</h2><button class="iconbtn" onclick="go('roster')">See all</button></div>${shifts.length?shifts.map(shiftcard).join(''):'<div class="empty">No shifts scheduled today.<p><button class="btn secondary" onclick="newShift()">Create a shift</button></p></div>'}</div><div class="card"><h2>Coming up next</h2>${upcoming.length?upcoming.slice(0,2).map(shiftcard).join(''):'<div class="empty">No upcoming shifts.</div>'}</div><div class="notice">🔒 Demo/local version: information stays in this browser on this device. Do not enter real patient or client health information until secure accounts, encryption and access controls are implemented.</div>`}
function roster(){let d=new Date(selected+'T12:00:00'),days=Array.from({length:7},(_,i)=>{let x=new Date(d);x.setDate(d.getDate()+i-3);return dateISO(x)}),shifts=db.shifts.filter(s=>s.date===selected).sort((a,b)=>a.start.localeCompare(b.start));return header('Your roster','Schedule',`<button class="btn small" onclick="newShift()">+ Add</button>`)+`<div class="card"><div class="row" style="margin-bottom:12px"><button class="btn ghost small" onclick="step(-7)">← Week</button><button class="btn secondary small" onclick="selected=today;render()">Today</button><button class="btn ghost small" onclick="step(7)">Week →</button></div><div class="dates">${days.map(s=>{let t=new Date(s+'T12:00:00');return `<button class="date ${selected===s?'active':''}" onclick="selected='${s}';render()"><span class="small">${t.toLocaleDateString('en-AU',{weekday:'short'})}</span><b>${t.getDate()}</b>${db.shifts.some(x=>x.date===s)?'•':'&nbsp;'}</button>`}).join('')}</div><div class="row"><h2>${datefmt(selected)}</h2><span class="tag">${shifts.length} shift${shifts.length===1?'':'s'}</span></div>${shifts.length?shifts.map(shiftcard).join(''):'<div class="empty">No shifts on this date.</div>'}</div>`}function step(n){let x=new Date(selected+'T12:00:00');x.setDate(x.getDate()+n);selected=dateISO(x);render()}
function clients(){return header('Clients','Care records',`<button class="btn small" onclick="newClient()">+ Client</button>`)+`<div class="card"><h2>Client directory</h2>${db.clients.length?db.clients.map(c=>`<div class="client" onclick="openClient('${c.id}')"><div class="initial">${esc(short(c.name))}</div><div style="flex:1"><b>${esc(c.name)}</b><div class="muted small">${esc(c.support||'No support type entered')}</div></div><span class="muted">›</span></div>`).join(''):'<div class="empty">Add your first client.</div>'}</div>`}
function notes(){return header('Progress notes','Documentation',`<button class="btn small" onclick="newNote()">+ Note</button>`)+`<div class="card"><h2>Recent notes</h2>${db.notes.length?db.notes.slice().sort((a,b)=>b.created.localeCompare(a.created)).map(n=>`<div style="padding:12px 0;border-bottom:1px solid #edf0f6"><div class="row"><b>${esc(client(n.clientId).name)}</b><span class="tag">${esc(n.type)}</span></div><div class="muted small">${new Date(n.created).toLocaleString('en-AU')}</div><p style="white-space:pre-wrap;margin:8px 0">${esc(n.text)}</p></div>`).join(''):'<div class="empty">No progress notes yet.</div>'}</div>`}
function more(){let complete=db.shifts.filter(s=>s.clockIn&&s.clockOut),hours=complete.reduce((a,s)=>a+(new Date(s.clockOut)-new Date(s.clockIn))/36e5,0);return header('More','Tools & settings')+`<div class="card"><h2>Timesheets</h2><div class="row"><div><div class="eyebrow">Completed shifts</div><b style="font-size:25px">${complete.length}</b></div><div><div class="eyebrow">Hours recorded</div><b style="font-size:25px">${hours.toFixed(2)}</b></div></div><div class="divider"></div>${complete.length?complete.map(s=>`<div class="row" style="padding:8px 0"><div><b>${esc(client(s.clientId).name)}</b><div class="muted small">${datefmt(s.date)}</div></div><b>${((new Date(s.clockOut)-new Date(s.clockIn))/36e5).toFixed(2)} h</b></div>`).join(''):'<p class="muted small">Clocked-out shifts will appear here.</p>'}<button class="btn secondary" onclick="exportCSV()">↓ Export timesheets CSV</button></div><div class="card"><h2>Profile</h2><form onsubmit="updateName(event)"><div class="field"><label>Your display name</label><input id="profileName" required maxlength="60" value="${esc(db.name)}"></div><button class="btn">Save name</button></form></div><div class="card"><h2>Data & backups</h2><p class="muted small">This prototype saves information in your current browser only. Clearing browser data may delete it. Back up regularly.</p><div class="inline"><button class="btn secondary" onclick="exportJSON()">↓ Download backup</button><label class="btn ghost">↑ Restore backup<input type="file" accept=".json,application/json" style="display:none" onchange="importJSON(event)"></label></div><div class="divider"></div><button class="btn danger" onclick="resetDemo()">Reset demo data</button></div><div class="footertext">CareFlow demo v1.0 · Independent prototype, not affiliated with ShiftCare.<br>Not a secure clinical records system.</div>`}
function render(){navrender();$('#avatar').textContent=short(db.name);$('#app').innerHTML=({home:dashboard,roster,clients,notes,more}[page])()};function showModal(title,html){modal=title;$('#modalHost').innerHTML=`<div class="modalshade" onclick="if(event.target===this)closeModal()"><div class="modal" role="dialog" aria-modal="true"><div class="modalhead"><h2 style="margin:0">${title}</h2><button class="close" aria-label="Close" onclick="closeModal()">×</button></div>${html}</div></div>`}function closeModal(){$('#modalHost').innerHTML='';modal='';render()}function field(name,label,type='text',value='',extra=''){return `<div class="field"><label for="${name}">${label}</label><input id="${name}" name="${name}" type="${type}" value="${esc(value)}" ${extra}></div>`}function textarea(name,label,value=''){return `<div class="field"><label for="${name}">${label}</label><textarea id="${name}" name="${name}">${esc(value)}</textarea></div>`}function optClients(chosen=''){return db.clients.map(c=>`<option value="${c.id}" ${c.id===chosen?'selected':''}>${esc(c.name)}</option>`).join('')}
function newClient(){showModal('Add a client',`<form onsubmit="createClient(event)">${field('name','Client name','text','','required maxlength="100"')}${field('phone','Phone (optional)','tel')}${field('address','Address (optional)')}${textarea('support','Support requirements')}${textarea('goals','Care plan goals')}${textarea('alerts','Important information (demo only)')}<button class="btn" style="width:100%">Save client</button></form>`)}function createClient(e){e.preventDefault();let f=new FormData(e.target);db.clients.push({id:id(),...Object.fromEntries(f.entries())});save();closeModal();go('clients')}
function openClient(cid){let c=client(cid),related=db.shifts.filter(s=>s.clientId===cid);showModal(esc(c.name),`<div class="row"><div class="initial" style="width:64px;height:64px;font-size:22px">${esc(short(c.name))}</div><span class="pill">Client profile</span></div><div class="divider"></div><div class="eyebrow">Support requirements</div><p>${esc(c.support||'Not entered')}</p><div class="eyebrow">Care goals</div><p>${esc(c.goals||'Not entered')}</p><div class="eyebrow">Important information</div><p>${esc(c.alerts||'Not entered')}</p><div class="eyebrow">Contact & location</div><p>${esc(c.phone||'No phone')}<br>${esc(c.address||'No address')}</p><div class="divider"></div><h3>Shifts (${related.length})</h3>${related.slice(0,5).map(shiftcard).join('')||'<p class="muted small">No shifts assigned.</p>'}<div class="divider"></div><div class="inline"><button class="btn secondary" onclick="editClient('${cid}')">Edit profile</button><button class="btn" onclick="newShift('${cid}')">+ Shift</button></div>`)}function editClient(cid){let c=client(cid);showModal('Edit client',`<form onsubmit="saveClient(event,'${cid}')">${field('name','Client name','text',c.name,'required')}${field('phone','Phone', 'tel',c.phone)}${field('address','Address','text',c.address)}${textarea('support','Support requirements',c.support)}${textarea('goals','Care goals',c.goals)}${textarea('alerts','Important information',c.alerts)}<button class="btn">Save changes</button></form>`)}function saveClient(e,cid){e.preventDefault();Object.assign(client(cid),Object.fromEntries(new FormData(e.target).entries()));save();closeModal();go('clients')}
function newShift(cid=''){if(!db.clients.length){alert('Add a client first.');return}showModal('Create shift',`<form onsubmit="createShift(event)"><div class="field"><label>Client</label><select name="clientId" required>${optClients(cid)}</select></div>${field('date','Date','date',selected,'required') }<div class="formgrid">${field('start','Start time','time','09:00','required')}${field('end','End time','time','12:00','required')}</div>${field('service','Support type','text','Community access','required')}${field('location','Location (optional)')}<button class="btn" style="width:100%">Create shift</button></form>`)}function createShift(e){e.preventDefault();let f=Object.fromEntries(new FormData(e.target).entries());if(f.end<=f.start){alert('End time must be after start time.');return}let s={id:id(),...f,status:'scheduled',tasks:[],clockIn:null,clockOut:null};db.shifts.push(s);save();selected=s.date;closeModal();go('roster')}
function openShift(sid,tab='overview'){let s=db.shifts.find(x=>x.id===sid);if(!s)return;detailTab=tab;let c=client(s.clientId),related=db.notes.filter(n=>n.shiftId===sid),isLive=!!s.clockIn&&!s.clockOut;showModal('Shift details',`<div class="row"><div><h2 style="margin:0">${esc(c.name)}</h2><p class="muted small" style="margin:5px 0">${esc(datefmt(s.date))}</p></div>${status(s.status)}</div><div class="card" style="margin-top:12px"><div style="font-size:21px;font-weight:800">${timefmt(s.start)} – ${timefmt(s.end)}</div><p class="muted small">${esc(s.service)} · ${duration(s.start,s.end)} scheduled hours</p>${s.location?`<p class="small">📍 ${esc(s.location)}</p>`:''}${s.clockIn?`<p class="small">Clocked in: ${new Date(s.clockIn).toLocaleString('en-AU')}</p>`:''}${s.clockOut?`<p class="small">Clocked out: ${new Date(s.clockOut).toLocaleString('en-AU')}</p>`:''}${s.status==='completed'?'<div class="notice">Shift completed and added to timesheets.</div>':`<button class="btn ${isLive?'danger':''}" style="width:100%" onclick="${isLive?`clockOut('${sid}')`:`clockIn('${sid}')`}">${isLive?'■ Clock out':'◷ Clock in'}</button>`}</div><div class="tabline"><button class="${tab==='overview'?'active':''}" onclick="openShift('${sid}','overview')">Tasks</button><button class="${tab==='notes'?'active':''}" onclick="openShift('${sid}','notes')">Notes</button><button class="${tab==='client'?'active':''}" onclick="openShift('${sid}','client')">Client</button></div>${tab==='overview'?`<div class="card"><div class="row"><h3>Shift tasks</h3><button class="iconbtn" onclick="addTask('${sid}')">+ Add</button></div>${s.tasks.length?s.tasks.map((t,i)=>`<label class="task"><input type="checkbox" ${t.done?'checked':''} onchange="toggleTask('${sid}',${i},this.checked)"><span style="${t.done?'text-decoration:line-through;color:#8a97a9':''}">${esc(t.name)}</span></label>`).join(''):'<p class="muted small">No tasks yet.</p>'}</div>`:tab==='notes'?`<div class="card"><div class="row"><h3>Progress notes</h3><button class="btn small" onclick="newNote('${sid}')">+ Add</button></div>${related.length?related.map(n=>`<div class="divider"></div><b>${esc(n.type)}</b><p class="muted small">${new Date(n.created).toLocaleString('en-AU')}</p><p style="white-space:pre-wrap">${esc(n.text)}</p>`).join(''):'<p class="muted small">No notes for this shift.</p>'}</div>`:`<div class="card"><h3>Support needs</h3><p>${esc(c.support||'Not entered')}</p><h3>Care goals</h3><p>${esc(c.goals||'Not entered')}</p><h3>Important information</h3><p>${esc(c.alerts||'Not entered')}</p></div>`}<div class="inline"><button class="btn secondary" onclick="newNote('${sid}')">+ Progress note</button>${s.status==='scheduled'?`<button class="btn ghost" onclick="editShift('${sid}')">Edit shift</button><button class="btn danger" onclick="deleteShift('${sid}')">Delete</button>`:''}</div>`)}
function clockIn(sid){let s=db.shifts.find(x=>x.id===sid);if(s.status==='completed')return;if(s.clockIn){openShift(sid);return}s.clockIn=stamp();s.status='in progress';save();openShift(sid)}function clockOut(sid){let s=db.shifts.find(x=>x.id===sid);if(!s.clockIn||s.clockOut)return;if(!confirm('Clock out and complete this shift?'))return;s.clockOut=stamp();s.status='completed';save();openShift(sid)}function addTask(sid){let t=prompt('New task description:');if(!t?.trim())return;db.shifts.find(s=>s.id===sid).tasks.push({name:t.trim(),done:false});save();openShift(sid)}function toggleTask(sid,i,done){db.shifts.find(s=>s.id===sid).tasks[i].done=done;save();openShift(sid)}function editShift(sid){let s=db.shifts.find(x=>x.id===sid);showModal('Edit shift',`<form onsubmit="saveShift(event,'${sid}')"><div class="field"><label>Client</label><select name="clientId">${optClients(s.clientId)}</select></div>${field('date','Date','date',s.date,'required')}<div class="formgrid">${field('start','Start','time',s.start,'required')}${field('end','End','time',s.end,'required')}</div>${field('service','Support type','text',s.service,'required')}${field('location','Location','text',s.location||'')}<button class="btn">Save shift</button></form>`)}function saveShift(e,sid){e.preventDefault();let f=Object.fromEntries(new FormData(e.target).entries());if(f.end<=f.start){alert('End must be after start');return}Object.assign(db.shifts.find(s=>s.id===sid),f);save();openShift(sid)}function deleteShift(sid){if(!confirm('Delete this shift?'))return;db.shifts=db.shifts.filter(s=>s.id!==sid);save();closeModal()}
function newNote(sid=''){if(!db.clients.length){alert('Add a client first.');return}let s=db.shifts.find(x=>x.id===sid);showModal('New progress note',`<form onsubmit="createNote(event)">${sid?`<input type="hidden" name="shiftId" value="${sid}">`:''}<div class="field"><label>Client</label><select name="clientId" required ${sid?'disabled':''}>${optClients(s?.clientId||'')}</select>${sid?`<input type="hidden" name="clientId" value="${s.clientId}">`:''}</div><div class="field"><label>Note type</label><select name="type"><option>Progress note</option><option>Shift handover</option><option>Observation</option><option>General note</option></select></div>${textarea('text','What happened during the shift?')}<button class="btn" style="width:100%">Save progress note</button></form>`)}function createNote(e){e.preventDefault();let f=Object.fromEntries(new FormData(e.target).entries());if(!f.text?.trim()){alert('Enter a note first');return}db.notes.push({id:id(),created:stamp(),...f});save();if(f.shiftId)openShift(f.shiftId,'notes');else{closeModal();go('notes')}}
function updateName(e){e.preventDefault();db.name=$('#profileName').value.trim();save();render()}function download(filename,blob){let a=document.createElement('a'),u=URL.createObjectURL(blob);a.href=u;a.download=filename;a.click();setTimeout(()=>URL.revokeObjectURL(u),500)}function exportJSON(){download('careflow-backup-'+today+'.json',new Blob([JSON.stringify(db,null,2)],{type:'application/json'}))}function exportCSV(){let rows=[['Date','Client','Support type','Scheduled start','Scheduled end','Clock in','Clock out','Actual hours','Status']];db.shifts.forEach(s=>rows.push([s.date,client(s.clientId).name,s.service,s.start,s.end,s.clockIn||'',s.clockOut||'',s.clockIn&&s.clockOut?((new Date(s.clockOut)-new Date(s.clockIn))/36e5).toFixed(2):'',s.status]));download('careflow-timesheets-'+today+'.csv',new Blob(['\ufeff'+rows.map(r=>r.map(v=>'"'+String(v).replaceAll('"','""')+'"').join(',')).join('\r\n')],{type:'text/csv;charset=utf-8'}))}async function importJSON(e){let file=e.target.files[0];if(!file)return;try{let d=JSON.parse(await file.text());if(!Array.isArray(d.clients)||!Array.isArray(d.shifts)||!Array.isArray(d.notes)||typeof d.name!=='string')throw Error('Invalid data');if(!confirm('Replace all local data with this backup?'))return;db=d;save();go('home')}catch(err){alert('Could not restore backup: '+err.message)}}function resetDemo(){if(!confirm('Replace all current local data with demo records? Export a backup first.'))return;db=demo();save();go('home')}
window.addEventListener('keydown',e=>{if(e.key==='Escape'&&modal)closeModal()});if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});render();
</script></body></html>
